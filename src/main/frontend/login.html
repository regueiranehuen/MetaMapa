<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - MetaMapa</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
<div class="container">
    <div style="margin-bottom: 20px;">
        <a href="index.html" class="back-arrow">&larr;</a>
        <a href="index.html" class="logo">
            <div class="logo-icon">M</div>
            <span class="logo-text">MetaMapa</span>
        </a>
    </div>

    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h2 class="login-title">Iniciar Sesión</h2>
                <p class="login-subtitle">Accede a tu cuenta para contribuir al sistema</p>
            </div>

            <form action="dashboard.html" method="get">
                <div class="form-group">
                    <label class="form-label">Nombre de Usuario</label>
                    <input type="text" class="form-input" placeholder="Ingresa tu nombre" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Contraseña</label>
                    <input type="password" class="form-input" placeholder="Ingresa tu contraseña" required>
                </div>

                <button type="submit" class="login-button">Iniciar Sesión</button>

                <a href="#" class="register-link">¿No tienes cuenta? Regístrate aquí</a>
            </form>
        </div>
    </div>
</div>
</body>

</html>
