<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:fragment="html(titulo, contenido)">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="${titulo} + ' · MetaMapa'">MetaMapa</title>

    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />

    <!-- Estilos propios -->
    <link th:href="@{/css/style.css}" rel="stylesheet" />

    <!-- Estilos mínimos del layout -->
    <style>
        :root{ --primary-color:#4f46e5; --secondary-color:#667eea; }
        body{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
        .logo-icon{ width:32px; height:32px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; background:var(--primary-color); color:#fff; font-weight:700; }
        .card:hover{ transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,0,0,.12); transition:.2s; }
        @media (max-width:768px){
            .btn, .form-control, .form-select{ min-height:48px; }
            .nav-link{ min-height:48px; display:flex; align-items:center; }
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

<!-- NAV -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm" th:fragment="navegacion">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
            <span class="logo-icon me-2">M</span>
            <span class="fw-bold">MetaMapa</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${#httpServletRequest.requestURI.startsWith('/hechos')}? 'active'"
                       th:href="@{/hechos}">
                        <i class="bi bi-eye me-1"></i> Hechos
                    </a>
                </li>
                <li class="nav-item"><a class="nav-link" th:href="@{/dashboard}"><i class="bi bi-map me-1"></i> Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/contribuir}"><i class="bi bi-plus-circle me-1"></i> Contribuir</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/auth/login}"><i class="bi bi-box-arrow-in-right me-1"></i> Iniciar sesión</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- HEADER (opcional) -->
<header class="bg-light border-bottom" th:fragment="header">
    <div class="container py-4">
        <h1 class="h3 mb-0" th:text="${titulo}"></h1>
    </div>
</header>


<!-- MAIN -->
<main class="flex-grow-1">
    <div class="container my-4">
        <div th:replace="${contenido}"></div>
    </div>
</main>

<!-- FOOTER -->
<footer class="bg-dark text-light mt-auto" th:fragment="footer">
    <div class="container py-3 d-flex align-items-center">
        <span class="logo-icon me-2">M</span>
        <span class="fw-bold">MetaMapa</span>
        <span class="text-white-50 ms-2">© <span th:text="${#temporals.createNow().year}">2025</span></span>
        <span class="ms-auto small text-white-50">
        <a class="link-light text-decoration-none me-3" href="#">Términos</a>
        <a class="link-light text-decoration-none me-3" href="#">Privacidad</a>
        <a class="link-light text-decoration-none" href="#">Contacto</a>
      </span>
    </div>
</footer>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
