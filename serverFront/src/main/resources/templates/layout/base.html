<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- tomar el titulo de los controllers ver min 17 -->
    <title th:text="${titulo} + ' - MetaMapa'"></title>

    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />

    <!-- Estilos propios -->
    <link th:href="@{/css/styles.css}" rel="stylesheet" />

</head>
<body class="d-flex flex-column min-vh-100">

<!-- NAV -->
<nav th:fragment="navegacion" class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm" >
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
            <span class="logo-icon me-2">M</span>
            <span class="fw-bold">MetaMapa</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">

            </ul>
        </div>
    </div>
</nav>

<!-- HEADER (opcional) -->
<header class="bg-light border-bottom" th:fragment="header">
    <div class="container py-4">
        <h1 class="h3 mb-0" th:text="${titulo}"></h1>
    </div>
</header>


<!-- Contenido Principal -->
<main class="flex-grow-1">
    <div class="container my-4">
        <div th:replace=":: contenido"></div>
    </div>
</main>

<!-- FOOTER -->
<footer th:fragment="footer" class="bg-dark text-light mt-auto" >
    <div class="container py-3 d-flex align-items-center">
        <span class="logo-icon me-2">M</span>
        <span class="fw-bold">MetaMapa</span>
        <span class="text-white-50 ms-2">© <span th:text="${#temporals.createNow().year}">2025</span></span>
        <span class="ms-auto small text-white-50">
        <a class="link-light text-decoration-none me-3" href="#">Términos</a>
        <a class="link-light text-decoration-none me-3" href="#">Privacidad</a>
        <a class="link-light text-decoration-none" href="#">Contacto</a>
      </span>
    </div>
</footer>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/common.js}"></script>
</body>
</html>
